name: PR Workflows

# Run action on pull request event
on: [pull_request]


jobs:
  # Build exampleSite
  build:
    runs-on: ubuntu-latest
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v4.1.1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.0.0
      with:
        hugo-version: 'latest'
        extended: true

    # 2. Re-initialize Go Modules for Hugo
    - name: Hugo Mod Tidy
      run: hugo mod tidy

    # 3. Regenerate the temporary package.json and install Bootstrap/Cytoscape
    - name: Install Theme Dependencies
      run: |
        hugo mod npm pack
        npm install

    # 4. Build your site with the extended version of Hugo
    - name: Build with Hugo
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: hugo --gc --minify

